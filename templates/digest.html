<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #faf8f4;
    --ink: #1c1b19;
    --muted: #6d6a64;
    --rule: #e4dfd6;
    --accent: #b4532a;
    --callout: #f2ede4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #161514;
      --ink: #ece8e1;
      --muted: #9a958c;
      --rule: #2e2c29;
      --accent: #e08a5e;
      --callout: #1f1d1b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.65 "Newsreader", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 56px 20px 80px; }
  .sans { font-family: "Inter", -apple-system, system-ui, sans-serif; }

  header { text-align: center; padding-bottom: 28px; border-bottom: 1px solid var(--ink); }
  .kicker {
    font: 500 11px/1 "Inter", system-ui, sans-serif;
    letter-spacing: .18em; text-transform: uppercase; color: var(--accent);
  }
  h1 { font-weight: 400; font-size: 46px; line-height: 1.05; margin: 14px 0 12px; letter-spacing: -.01em; }
  .dateline { font: 13px/1.4 "Inter", system-ui, sans-serif; color: var(--muted); }
  .dateline b { font-weight: 500; color: var(--ink); }

  .big-picture {
    margin: 32px 0 8px; padding: 20px 24px;
    background: var(--callout); border-left: 3px solid var(--accent);
    font-style: italic; font-size: 18px;
  }

  section { margin-top: 44px; }
  h2 {
    display: flex; justify-content: space-between; align-items: baseline;
    font: 600 12px/1 "Inter", system-ui, sans-serif;
    letter-spacing: .16em; text-transform: uppercase;
    margin: 0 0 4px; padding-bottom: 10px; border-bottom: 1px solid var(--rule);
  }
  h2 .count { color: var(--muted); font-weight: 400; letter-spacing: 0; }

  .story { padding: 22px 0; border-bottom: 1px solid var(--rule); }
  .story:last-child { border-bottom: 0; }
  .story h3 { font-size: 21px; line-height: 1.3; font-weight: 600; margin: 0 0 8px; }
  .story h3 a { color: inherit; text-decoration: none; }
  .story h3 a:hover { color: var(--accent); }
  .story p { margin: 0 0 8px; }
  .meta { font: 12px/1 "Inter", system-ui, sans-serif; color: var(--muted); }

  footer {
    margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--ink);
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    font: 13px/1.5 "Inter", system-ui, sans-serif; color: var(--muted);
  }
  footer a { color: var(--accent); text-decoration: none; font-weight: 500; }

  @media (max-width: 520px) {
    .wrap { padding: 36px 16px 60px; }
    h1 { font-size: 36px; }
    .story h3 { font-size: 19px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="kicker">Tech · Venture · AI</div>
      <h1>The Morning Brief</h1>
      <div class="dateline"><b>{{DATE_LONG}}</b> &nbsp;·&nbsp; {{STORY_COUNT}} stories &nbsp;·&nbsp; {{READ_MINUTES}} min read</div>
    </header>

    <div class="big-picture">{{BIG_PICTURE}}</div>

{{SECTIONS}}

    <footer>
      <span>Summaries written by Claude. Tap a headline to read the full story.</span>
      <a href="jobs.html">Utah startup roles →</a>
    </footer>
  </div>
</body>
</html>
